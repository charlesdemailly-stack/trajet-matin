name: diag-rt
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip -q install gtfs-realtime-bindings requests
          python - <<'PY'
          import requests,time,collections
          from google.transit import gtfs_realtime_pb2 as g
          r=requests.get("https://proxy.transport.data.gouv.fr/resource/ilevia-lille-gtfs-rt",timeout=30)
          print("HTTP",r.status_code,len(r.content),r.headers.get("content-type"))
          f=g.FeedMessage();f.ParseFromString(r.content)
          now=time.time();print("header ts",f.header.timestamp,"age s",round(now-f.header.timestamp))
          print("entities",len(f.entity))
          routes=collections.Counter();stops=set();chf=[]
          for e in f.entity:
            if e.HasField("trip_update"):
              tu=e.trip_update;routes[tu.trip.route_id]+=1
              for s in tu.stop_time_update:
                stops.add(s.stop_id)
                if "CHF" in s.stop_id or "CHAUF" in s.stop_id.upper(): chf.append((tu.trip.route_id,s.stop_id,s.arrival.time or s.departure.time))
          print("routes",sorted(routes.items())[:80])
          print("n stops",len(stops),"sample",sorted(stops)[:15])
          print("CHF matches",len(chf),chf[:10])
          for k in ("86","88","L5","L91"):
            print(k,[x for x in routes if k in x][:6])
          PY
